<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Buchabfrage</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">

    <ion-grid>
      <ion-row>
        <ion-col size="12">
          <ion-item>
            <ion-label position="stacked">ISBN-13</ion-label>
            <ion-input
                  type="tel"
                  inputmode="numeric"
                  pattern="[0-9]*"
                  maxlength="13"
                  placeholder="ISBN-13 von Buch eingeben, für das Daten abgerufen werden sollen"
                  [(ngModel)]="isbn13"></ion-input>
          </ion-item>
          <ion-note color="danger" *ngIf="fehlermeldung">
            {{ fehlermeldung }}
          </ion-note>
        </ion-col>
      </ion-row>

      <ion-row>
        <ion-col size="12" size-md="6">
          <ion-button expand="block"
                      [disabled]="requestLaeuft"
                      (click)="onAbrufenButton()">Daten abrufen</ion-button>
        </ion-col>
        <ion-col size="12" size-md="6">
          <ion-button expand="block"
                      color="medium"
                      [disabled]="requestLaeuft"
                      (click)="onLoeschenButton()">Löschen</ion-button>
        </ion-col>
      </ion-row>

      <br>

      <ion-row>
        <ion-col size="12">
          <ion-item>
            <ion-label position="stacked">Autor</ion-label>
            <ion-input readonly [(ngModel)]="autor"></ion-input>
          </ion-item>
        </ion-col>

        <ion-col size="12">
          <ion-item>
            <ion-label position="stacked">Titel</ion-label>
            <ion-input readonly [(ngModel)]="titel"></ion-input>
          </ion-item>
        </ion-col>

        <ion-col size="12">
          <ion-item>
            <ion-label position="stacked">Verlag</ion-label>
            <ion-input readonly [(ngModel)]="verlag"></ion-input>
          </ion-item>
        </ion-col>

      </ion-row>

    </ion-grid>

</ion-content>
